<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גלעם · בקרת הזמנות רכש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#EBECE7; --card:#F7F8F4; --sunk:#E2E4DC;
  --ink:#1E2127; --steel:#656C74; --faint:#8E959C; --line:#D2D5CC; --hair:#C3C7BC;
  --brand:#4E8C22; --brand-pure:#78BC41;
  --amber:#9A6B06; --amber-bg:#F2E4C2;
  --red:#A3221A; --red-bg:#F3D9D5;
  --moss:#416F1C; --moss-bg:#E1EFD2;
  --sea:#27506F; --sea-bg:#D8E3EC;
  --box-sizing:border-box;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171B; --card:#1C1F24; --sunk:#111317;
    --ink:#E7E9E3; --steel:#949BA3; --faint:#6E757D; --line:#2B2F35; --hair:#373C43;
    --brand:#8CCB58; --brand-pure:#78BC41;
    --amber:#D9A227; --amber-bg:#3A2E12;
    --red:#E56A5C; --red-bg:#3C1E1A;
    --moss:#8CCB58; --moss-bg:#1E2E14;
    --sea:#7EAEDC; --sea-bg:#152635;
  }
}
:root[data-theme="dark"]{
  --paper:#15171B; --card:#1C1F24; --sunk:#111317;
  --ink:#E7E9E3; --steel:#949BA3; --faint:#6E757D; --line:#2B2F35; --hair:#373C43;
  --brand:#8CCB58; --brand-pure:#78BC41;
  --amber:#D9A227; --amber-bg:#3A2E12;
  --red:#E56A5C; --red-bg:#3C1E1A;
  --moss:#8CCB58; --moss-bg:#1E2E14;
  --sea:#7EAEDC; --sea-bg:#152635;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Rubik","Segoe UI",system-ui,-apple-system,"Arial Hebrew",sans-serif;
  font-weight:400; font-size:15px; line-height:1.5;
  font-variant-numeric:tabular-nums lining-nums;
}
h1,h2,h3{margin:0;font-weight:500}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums;direction:ltr;unicode-bidi:plaintext;display:inline-block}

/* ---------- masthead ---------- */
.mast{background:var(--ink);color:var(--paper);padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;}
.mast-in{max-width:1480px;margin:0 auto;display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;line-height:1}
.logo{height:31px;width:auto;display:block}
.brand-t{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:23px;font-weight:500;color:var(--paper);
  border-inline-start:1px solid #4A4F54;padding-inline-start:13px;letter-spacing:-.01em}
.modes{display:flex;gap:0;border:1px solid #4A4F54;border-radius:2px;overflow:hidden}
.mode{background:transparent;border:0;padding:7px 16px;cursor:pointer;color:#A9AEA4;font-size:13.5px;white-space:nowrap}
.mode:hover{background:#2C3137;color:var(--paper)}
.mode[aria-pressed="true"]{background:var(--brand);color:#0E1A06;font-weight:500}
footer.site{border-top:1px solid var(--line);background:var(--card);margin-top:14px;
  padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px))}
footer.site .fin{max-width:1480px;margin:0 auto;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--steel)}
footer.site .cr{color:var(--ink)}
footer.site .sep{color:var(--hair)}
.mast-meta{font-size:12.5px;color:#A9AEA4;line-height:1.45;flex:1 1 220px}
.mast-meta b{color:var(--paper);font-weight:500}
.mast-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--hair);color:inherit;padding:7px 14px;border-radius:2px;cursor:pointer;font-size:13.5px;transition:background .12s,border-color .12s}
.btn:hover{background:rgba(127,127,127,.14)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mast .btn{border-color:#4A4F54;color:var(--paper)}
.mast .btn:hover{background:#2C3137}
.btn-solid{background:var(--brand);border-color:var(--brand);color:#F3FAEC;font-weight:500}
.mast .btn-solid{color:#F3FAEC}
.btn-solid:hover{filter:brightness(1.08);background:var(--amber)}
.btn-sm{padding:4px 10px;font-size:12.5px}

/* ---------- instrument strip ---------- */
.strip{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
.gauge{flex:1 1 150px;padding:16px 18px 15px;border-inline-start:1px solid var(--line)}
.gauge:first-child{border-inline-start:0;padding-inline-start:0}
.gauge-k{font-size:11.5px;color:var(--steel);letter-spacing:.01em}
.gauge-v{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:31px;font-weight:500;line-height:1.1;margin-top:3px}
.gauge-s{font-size:11.5px;color:var(--faint);margin-top:2px}
.gauge.alarm .gauge-v{color:var(--red)}
.gauge.warn .gauge-v{color:var(--amber)}

/* ---------- tabs ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.rail-in{max-width:1480px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;color:var(--steel);white-space:nowrap;font-size:14.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:500}
.tab .cnt{font-size:11.5px;color:var(--faint);margin-inline-start:5px}
.tab[aria-selected="true"] .cnt{color:var(--brand)}

.suprow{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:start;
  background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.suprow:hover{background:var(--sunk)}
.suprow.on{background:var(--moss-bg);box-shadow:inset 3px 0 0 var(--brand)}
.suprow .sname{font-size:13.5px}
.suprow .smeta{font-size:11.5px;color:var(--steel)}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:2px;margin-top:11px;overflow:hidden}
.kv{background:var(--card);padding:7px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kvk{font-size:11px;color:var(--faint)}
.kvv{font-size:13px;word-break:break-word}
.clickrow{cursor:pointer}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.fgrid label{display:block}
.rail-ref{display:flex;align-items:center;padding-inline-start:10px}
.refresh{white-space:nowrap}
.refresh.pulse{box-shadow:0 0 0 0 rgba(78,140,34,.55);animation:pz 1.9s ease-out infinite}
.refresh.pulse::after{content:" •"}
@keyframes pz{0%{box-shadow:0 0 0 0 rgba(78,140,34,.5)}70%{box-shadow:0 0 0 7px rgba(78,140,34,0)}100%{box-shadow:0 0 0 0 rgba(78,140,34,0)}}
main{max-width:1480px;margin:0 auto;padding:22px 20px 60px}
.panel{display:none}
.panel.on{display:block}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:500}
.sec-h p{margin:0;font-size:12.5px;color:var(--steel);flex:1 1 200px}
.box{background:var(--card);border:1px solid var(--line);border-radius:3px}
.box-p{padding:14px 16px}

/* ---------- filters ---------- */
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:3px}
.fgrp{min-width:150px}
.flab{font-size:11.5px;color:var(--steel);margin-bottom:5px;display:block}
input[type=text],input[type=search],select{font:inherit;font-size:13.5px;background:var(--paper);border:1px solid var(--hair);color:var(--ink);border-radius:2px;padding:6px 9px;width:100%}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-width:560px}
.chip{border:1px solid var(--hair);background:var(--paper);border-radius:2px;padding:4px 9px;font-size:12.5px;cursor:pointer;color:var(--steel);white-space:nowrap}
.chip:hover{border-color:var(--steel)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.bad[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip .n{opacity:.6;font-size:11px;margin-inline-start:4px}
label.ck{display:flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;padding-top:4px}
label.ck input{accent-color:var(--brand);width:15px;height:15px}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:940px}
thead th{position:sticky;top:0;background:var(--sunk);text-align:start;font-weight:500;color:var(--steel);
  padding:9px 10px;border-bottom:1px solid var(--hair);white-space:nowrap;cursor:pointer;font-size:12px;z-index:2}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.5;font-size:10px}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--sunk)}
tbody tr.late td{background:var(--red-bg)}
tbody tr.late:hover td{filter:brightness(.97)}
.desc{max-width:300px;min-width:170px}
.ta-e{text-align:end}
.sub{font-size:11.5px;color:var(--faint);display:block}
.tag{display:inline-block;font-size:11px;padding:1.5px 7px;border-radius:2px;white-space:nowrap;border:1px solid transparent}
.t-red{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.t-amb{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.t-moss{background:var(--moss-bg);color:var(--moss);border-color:var(--moss)}
.t-sea{background:var(--sea-bg);color:var(--sea);border-color:var(--sea)}
.t-mute{background:var(--sunk);color:var(--steel);border-color:var(--hair)}
.more{text-align:center;padding:12px}
.empty{padding:34px 18px;text-align:center;color:var(--steel);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px;font-size:15px}

/* ---------- charts ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.chart-t{font-size:14px;font-weight:500;margin-bottom:2px}
.chart-s{font-size:11.5px;color:var(--faint);margin-bottom:12px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:160px}
.legend div{display:flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:1px;flex:none}
.legend .lv{margin-inline-start:auto;color:var(--steel);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{font-size:12.5px}
.bar-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.bar-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:7px;background:var(--sunk);border-radius:1px;overflow:hidden}
.bar-fill{height:100%;background:var(--sea)}
.bar-fill.red{background:var(--red)}
.bar-fill.amb{background:var(--amber)}
.bar-fill.moss{background:var(--moss)}

/* ---------- recommendations ---------- */
.rec{border:1px solid var(--line);border-radius:3px;background:var(--card);margin-bottom:14px;overflow:hidden}
.rec-h{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunk);flex-wrap:wrap}
.rec-h h3{font-size:15px}
.rec-h .why{font-size:12px;color:var(--steel);flex:1 1 180px}
.rec-h .cnt{font-size:12.5px;color:var(--steel)}
.rec-b{padding:0}
.rec-b table{min-width:620px}
.sev{width:3px;align-self:stretch;flex:none}
.rec.sev-red{border-inline-start:3px solid var(--red)}
.rec.sev-amb{border-inline-start:3px solid var(--amber)}
.rec.sev-sea{border-inline-start:3px solid var(--sea)}

.drop{border:1.5px dashed var(--hair);border-radius:3px;padding:26px 18px;text-align:center;color:var(--steel);font-size:13.5px;background:var(--card)}
.drop.hot{border-color:var(--brand);background:var(--moss-bg);color:var(--ink)}
.note{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.55}
.toast{position:fixed;inset-block-end:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:3px;font-size:13.5px;z-index:90;
  box-shadow:0 4px 18px rgba(0,0,0,.22);max-width:min(420px,88vw)}
.hide{display:none!important}
@media (max-width:620px){
  .brand{font-size:22px}.gauge-v{font-size:25px}.gauge{flex-basis:46%;padding:13px 12px}
  .gauge:nth-child(odd){border-inline-start:0;padding-inline-start:0}
  main{padding:16px 14px 50px}.strip{padding:0 14px}.rail-in{padding:0 14px}.mast{padding-inline:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ============================================================
   גלעם — בקרת הזמנות רכש. קורא את דוח "הזמנות רכש פתוחות"
   של Priority, מנרמל אותו, ומנתח אותו בדפדפן בלבד.
   ============================================================ */
window.__galamApp=function(){
"use strict";

/* ---------- utils ---------- */
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const nf0=new Intl.NumberFormat('he-IL',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('he-IL',{maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₪'+nf0.format(Math.round(v||0));
const short=v=>{v=v||0;const a=Math.abs(v);
  if(a>=1e6)return '₪'+nf2.format(v/1e6)+'M'; if(a>=1e3)return '₪'+nf0.format(v/1e3)+'K'; return '₪'+nf0.format(v);};
const qty=v=>v==null?'':nf2.format(v);
const dstr=d=>{if(!d)return '';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const HEB_MON=['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
const monLabel=k=>{const[y,m]=k.split('-');return HEB_MON[+m-1]+" '"+y.slice(2);};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('galam.'+k));localStorage.setItem('galam.'+k,JSON.stringify(v));}catch(e){}
  if(v!==undefined)window.__galamSync&&window.__galamSync(k,v);return null;}

function toast(msg,ms){
  const t=el('div','toast',esc(msg));document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms||3600);
}

/* ---------- header mapping (Priority → internal) ---------- */
const norm=s=>String(s==null?'':s).replace(/[\s'"׳״`.\-\/\\()]/g,'').trim().toLowerCase();
const ALIAS={
  supplierNo:['מסספק','מספרספק','ספרספק','קודספק'],
  supplier:['שםספק','ספק','שםהספק'],
  phone:['טלפון','טל'],
  po:['הזמנה','מסהזמנה','מספרהזמנה','הזמנתרכש'],
  buyer:['לטיפול','קניין','קנין','אחראי','מטפל'],
  orderDate:['תאריך','תאריךהזמנה','תהזמנה'],
  sku:['מקט','מקט/','מספרפריט','פריט'],
  desc:['תאורפריט','תיאורפריט','תאור'],
  descEn:['תיאורלועזי','תאורלועזי'],
  cls:['סיווגמלאיסוגפריט','סיווגמלאי','סוגפריט'],
  cat:['קטגוריתמלאי','קטגוריה'],
  due:['תאספקה','תאריךאספקה','אספקה','תאריךאספקהמובטח'],
  qtyOrd:['כמותבהזמנה','כמותמוזמנת','כמות'],
  qtyRec:['כמותשסופקה','כמותשהתקבלה','סופק'],
  qtyOpen:['יתרהלאספקה','יתרה','יתרתאספקה'],
  unit:['יח','יחידה','יחמידה'],
  openVal:['שוויהיתרה','שוויתרה'],
  curr:['מטבע'],
  openILS:['שוויהיתרהבשקלים','שוויהיתרהשח','שוויבשקלים'],
  qtyInv:['כמותבחשבוניות','כמותבחשבונית'],
  importFile:['תיקיבוא'],
  shipDate:['תיציאה','תאריךיציאה'],
  arrDate:['תהגעה','תאריךהגעה'],
  status:['תאורסטטוסהזמנה','סטטוסהזמנה','סטטוס','תיאורסטטוסהזמנה'],
  unitPrice:['מחירליחידה','מחיריח','מחיר']
};
const NUMF=['qtyOrd','qtyRec','qtyOpen','openVal','openILS','qtyInv','unitPrice'];
const DATEF=['orderDate','due','shipDate','arrDate'];

function mapHeadersWith(hdr,dict){
  const map={};
  hdr.forEach((h,i)=>{
    const n=norm(h); if(!n)return;
    for(const key in dict){
      if(map[key]!==undefined)continue;
      if(dict[key].some(a=>norm(a)===n)){map[key]=i;return;}
    }
  });
  hdr.forEach((h,i)=>{
    const n=norm(h); if(!n)return;
    for(const key in dict){
      if(map[key]!==undefined)continue;
      if(Object.values(map).indexOf(i)>-1)continue;
      if(dict[key].some(a=>{a=norm(a);return n.indexOf(a)>-1||(a.indexOf(n)>-1&&n.length>3);})){map[key]=i;return;}
    }
  });
  return map;
}
const mapHeaders=hdr=>mapHeadersWith(hdr,ALIAS);
function toNum(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  const s=String(v).replace(/[^0-9.\-]/g,''); const f=parseFloat(s); return isFinite(f)?f:null;
}
function toDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number'){ // excel serial
    const d=new Date(Math.round((v-25569)*864e5));
    if(isNaN(d))return null;
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if(m){let y=+m[3]; if(y<100)y+=2000; return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}
  const d=new Date(s); if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return null;
}
function clean(v){return v==null?null:String(v).replace(/\s+/g,' ').trim()||null;}

/* ---------- derive ---------- */
function derive(rows){
  const T=todayISO();
  rows.forEach(r=>{
    NUMF.forEach(k=>{if(typeof r[k]==='string')r[k]=toNum(r[k]);});
    if(r.qtyOpen==null&&r.qtyOrd!=null)r.qtyOpen=(r.qtyOrd||0)-(r.qtyRec||0);
    if(r.openILS==null)r.openILS=r.openVal||0;
    r.openILS=r.openILS||0;
    r.daysLate=r.due?dayDiff(r.due,T):null;
    r.late=!!(r.due&&r.daysLate>0&&(r.qtyOpen||0)>0);
    r.partial=(r.qtyRec||0)>0&&(r.qtyOpen||0)>0;
    r.month=r.due?r.due.slice(0,7):'ללא תאריך';
    r.pct=r.qtyOrd?Math.max(0,Math.min(100,100*(r.qtyRec||0)/r.qtyOrd)):0;
    r.hay=((r.po||'')+' '+(r.supplier||'')+' '+(r.sku||'')+' '+(r.desc||'')+' '+(r.descEn||'')+' '+(r.buyer||'')+' '+(r.status||'')+' '+(r.cat||'')+' '+(r.cls||'')).toLowerCase();
  });
  return rows;
}

/* ---------- state ---------- */
const seed=JSON.parse($('#seed').textContent);
function fromSeed(){
  return seed.rows.map(a=>{const o={};seed.keys.forEach((k,i)=>o[k]=a[i]);return o;});
}
/* סטטוס תקין אחד בלבד: אושר ע"י ספק. כל השאר טעון טיפול. */
const DEFAULT_OK=['אושר ע"י ספק'];
const DEFAULT_GROUPS=[
  {name:'חומרי גלם',kw:['תירס','סוכר','גלוקוז','עמילן','חיטה','דקסטרוז','מולסה','raw','starch','sugar','corn','maize','syrup']},
  {name:'כימיקלים',kw:['כימיקל','חומצה','נתרן','סודה','אנזים','כלור','acid','caustic','enzyme','chemical','naoh','hcl']},
  {name:'אריזות ומיכלים',kw:['אריזה','שק','מיכל','חבית','יריעה','מדבקה','pack','bag','drum','ibc','container','label','pallet']},
  {name:'לוגיסטיקה ושינוע',kw:['הובלה','שינוע','הסעה','משלוח','עמילות','נמל','מכולה','freight','shipping','transport','logistic','customs']},
  {name:'חלפים ותחזוקה',kw:['משאבה','מסב','מנוע','ברז','אטם','חלף','חלקי','תיקון','אחזקה','pump','bearing','valve','motor','seal','spare','maintenance']},
  {name:'מעבדה',kw:['מעבדה','ריאגנט','בדיקה','כיול','lab','reagent','calibration']}
];

function newFilters(){return{buyers:new Set(),statuses:new Set(),q:'',onlyLate:false,onlyBad:false,onlyPartial:false,crit:new Set(store('crit')||[]),critQ:''};}
function cloneFilters(f){return{buyers:new Set(f.buyers),statuses:new Set(f.statuses),q:f.q,onlyLate:f.onlyLate,onlyBad:f.onlyBad,onlyPartial:f.onlyPartial,crit:new Set(f.crit),critQ:f.critQ};}
const S={
  rows:derive(fromSeed()),
  label:seed.source+' · '+dstr(seed.snapshot),
  custom:false,
  tab:'track',
  mode:'po',
  sup:[],
  supLabel:'',
  supCustom:false,
  sf:null,sd:null,
  spend:[],spendLabel:'',pf:null,pd:null,pPending:null,
  items:[],itemLabel:'',itd:null,itf:null,itemSel:null,isort:null,itemBusy:'',
  yA:null,yB:null,pivotDim:'supplier',pivotPer:'year',
  supMeta:store('supmeta')||{},
  supSel:null,
  supQ:'',
  f:newFilters(),      // הסינון שהוחל על המסך
  d:newFilters(),      // הבחירה הנוכחית, ממתינה לרענון
  dirty:false,
  ok:new Set(store('ok')||DEFAULT_OK),
  limit:150,
  sort:{k:'due',dir:1}
};
const isBad=r=>!S.ok.has(typeof r==='string'?r:r.status);
function markDirty(){
  S.dirty=true;
  document.querySelectorAll('.refresh').forEach(b=>{b.classList.add('btn-solid');b.classList.add('pulse');});
}
function applyFilters(){
  S.f=cloneFilters(S.d);S.dirty=false;S.limit=150;
  store('crit',[...S.d.crit]);
  render();
}
function bindChips(container,set){
  if(!container)return;
  container.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
    const v=b.dataset.v; if(set.has(v)){set.delete(v);b.setAttribute('aria-pressed','false');}
    else{set.add(v);b.setAttribute('aria-pressed','true');}
    markDirty();};
}
function refreshBtn(id,label){
  return `<button class="btn btn-sm refresh ${S.dirty?'btn-solid pulse':''}" data-refresh="1" id="${id||''}">${label||'רענון תצוגה'}</button>`;
}
const saved=store('data');
if(saved&&saved.rows&&saved.rows.length){S.rows=derive(saved.rows);S.label=saved.label;S.custom=true;}

/* ---------- selectors ---------- */
const uniq=(arr,k)=>{const m=new Map();arr.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1);});return [...m.entries()].sort((a,b)=>b[1]-a[1]);};
function filtered(){
  const f=S.f,q=f.q.toLowerCase().trim();
  return S.rows.filter(r=>{
    if(f.buyers.size&&!f.buyers.has(r.buyer||'—'))return false;
    if(f.statuses.size&&!f.statuses.has(r.status||'—'))return false;
    if(f.onlyLate&&!r.late)return false;
    if(f.onlyBad&&!isBad(r))return false;
    if(f.onlyPartial&&!r.partial)return false;
    if(q&&r.hay.indexOf(q)<0)return false;
    return true;
  });
}
const sum=(a,k)=>a.reduce((s,r)=>s+(r[k]||0),0);
function group(arr,keyFn){
  const m=new Map();
  arr.forEach(r=>{const k=keyFn(r)||'—';let g=m.get(k);if(!g){g={k,rows:[],val:0,late:0,lateVal:0};m.set(k,g);}
    g.rows.push(r);g.val+=r.openILS||0;if(r.late){g.late++;g.lateVal+=r.openILS||0;}});
  return [...m.values()];
}

/* ---------- SVG charts ---------- */
const PALETTE=['#27506F','#9A6B06','#2C6248','#A3221A','#6B5B95','#3E7C8F','#8A6B4F','#55606B','#7D8C3F','#A2566B'];
function donut(data,size){
  size=size||168;const R=size/2,r=R*0.6;const tot=data.reduce((s,d)=>s+d.v,0)||1;let a=-Math.PI/2;
  let p='';
  data.forEach((d,i)=>{
    const ang=d.v/tot*Math.PI*2,b=a+ang;
    const x1=R+R*Math.cos(a),y1=R+R*Math.sin(a),x2=R+R*Math.cos(b),y2=R+R*Math.sin(b);
    const xi2=R+r*Math.cos(b),yi2=R+r*Math.sin(b),xi1=R+r*Math.cos(a),yi1=R+r*Math.sin(a);
    const lg=ang>Math.PI?1:0;
    if(ang>0.0001)p+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${lg} 1 ${x2} ${y2} L${xi2} ${yi2} A${r} ${r} 0 ${lg} 0 ${xi1} ${yi1} Z" fill="${d.c||PALETTE[i%10]}"><title>${esc(d.k)}: ${nf0.format(d.v)}</title></path>`;
    a=b;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="התפלגות">${p}</svg>`;
}
function bars(data,opt){
  opt=opt||{};const max=Math.max(1,...data.map(d=>d.v));
  return '<div class="bars">'+data.map(d=>`<div class="bar-row">
    <div class="bar-top"><span title="${esc(d.k)}">${esc(d.k)}</span><span class="num" style="color:var(--steel)">${esc(d.lab!=null?d.lab:nf0.format(d.v))}</span></div>
    <div class="bar-track"><div class="bar-fill ${d.cls||opt.cls||''}" style="width:${(d.v/max*100).toFixed(1)}%"></div></div></div>`).join('')+'</div>';
}
function columns(data,opt){
  opt=opt||{};const W=Math.max(360,data.length*54),H=150,P=22;
  const max=Math.max(1,...data.map(d=>d.v));
  let s=`<svg viewBox="0 0 ${W} ${H+34}" width="100%" height="${H+34}" preserveAspectRatio="none" style="display:block">`;
  s+=`<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--hair)" stroke-width="1"/>`;
  data.forEach((d,i)=>{
    const bw=W/data.length,x=W-(i+1)*bw+bw*0.18,w=bw*0.64;
    const h=Math.max(1,(d.v/max)*(H-P));
    const vl=d.vlab!=null?d.vlab:short(d.v);
    s+=`<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${d.c||'var(--sea)'}" rx="1"><title>${esc(d.k)}: ${esc(vl)}</title></rect>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${H+15}" font-size="11" fill="var(--steel)" text-anchor="middle" font-family="Rubik,sans-serif">${esc(d.lab||d.k)}</text>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${(H-h-5).toFixed(1)}" font-size="10.5" fill="var(--faint)" text-anchor="middle" font-family="Rubik,sans-serif">${esc(vl)}</text>`;
  });
  return s+'</svg>';
}

/* ---------- table builder ---------- */
const COLS=[
  {k:'po',t:'הזמנה',f:r=>`<b style="font-weight:500">${esc(r.po)}</b><span class="sub">${esc(r.buyer||'')} · ${dstr(r.orderDate)}</span>`},
  {k:'supplier',t:'ספק',f:r=>`${esc(r.supplier)}<span class="sub">${esc(r.supplierNo||'')}</span>`},
  {k:'sku',t:'מק״ט ותיאור',cls:'desc',f:r=>`${esc(r.desc||'')}<span class="sub">${esc(r.sku||'')}${r.cls?' · '+esc(r.cls):''}</span>`},
  {k:'due',t:'ת. אספקה',f:r=>`${dstr(r.due)}${r.late?`<span class="sub" style="color:var(--red)">איחור ${r.daysLate} ימים</span>`:(r.daysLate!=null&&r.daysLate>-15?`<span class="sub">בעוד ${-r.daysLate} ימים</span>`:'')}`},
  {k:'qtyOpen',t:'יתרה / הוזמן',cls:'ta-e',f:r=>`<span class="num">${qty(r.qtyOpen)}</span> <span style="color:var(--faint)">/ ${qty(r.qtyOrd)}</span> ${esc(r.unit||'')}${r.partial?`<span class="sub">סופק ${r.pct.toFixed(0)}%</span>`:''}`},
  {k:'openILS',t:'שווי יתרה',cls:'ta-e',f:r=>`<span class="num">${money(r.openILS)}</span>${r.curr&&r.curr!=='ILS'?`<span class="sub num">${nf0.format(r.openVal)} ${esc(r.curr)}</span>`:''}`},
  {k:'status',t:'סטטוס',f:r=>`<span class="tag ${isBad(r)?'t-amb':'t-moss'}">${esc(r.status||'—')}</span>${r.late?' <span class="tag t-red">באיחור</span>':''}`}
];
function sortRows(arr){
  const{k,dir}=S.sort;
  return arr.slice().sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==='due'||k==='orderDate'){x=x||'9999';y=y||'9999';}
    if(typeof x==='number'||typeof y==='number'){x=x||0;y=y||0;return (x-y)*dir;}
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'he')*dir;
  });
}
function renderTable(rows,mount,limitKey){
  const sorted=sortRows(rows), shown=sorted.slice(0,S.limit);
  const head=COLS.map(c=>`<th data-sk="${c.k}">${c.t} ${S.sort.k===c.k?`<span class="ar">${S.sort.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const body=shown.map(r=>`<tr class="${r.late?'late':''}">`+COLS.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')+'</tr>').join('');
  mount.innerHTML=rows.length?
    `<div class="tscroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`+
    (sorted.length>shown.length?`<div class="more"><button class="btn" id="more">הצגת 150 שורות נוספות (${nf0.format(sorted.length-shown.length)} נותרו)</button></div>`:'')
    :`<div class="box empty"><b>אין שורות התואמות את הסינון</b>נקו את המסננים או שנו את טווח החיפוש.</div>`;
  mount.querySelectorAll('th[data-sk]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sk; S.sort=(S.sort.k===k)?{k,dir:-S.sort.dir}:{k,dir:k==='openILS'?-1:1}; render();
  });
  const m=mount.querySelector('#more'); if(m)m.onclick=()=>{S.limit+=150;render();};
}

/* ---------- export ---------- */
const EXPORT_COLS=[['po','הזמנה'],['orderDate','תאריך הזמנה'],['buyer','קניין'],['supplierNo','מס\' ספק'],['supplier','ספק'],
  ['sku','מק״ט'],['desc','תיאור פריט'],['cls','סיווג'],['cat','קטגוריה'],['due','ת. אספקה'],['daysLate','ימי איחור'],
  ['qtyOrd','כמות בהזמנה'],['qtyRec','סופק'],['qtyOpen','יתרה'],['unit','יח\''],['unitPrice','מחיר ליחידה'],
  ['openVal','שווי יתרה'],['curr','מטבע'],['openILS','שווי יתרה ₪'],['status','סטטוס']];
async function saveFile(filename,data){
  try{
    const dl=await window.claude?.use?.('downloads');
    if(dl){await dl.save({filename,data});toast('הקובץ נשמר: '+filename);return;}
  }catch(e){
    if(e&&e.code==='declined'){return;}
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('הקובץ נשמר: '+filename);
  }catch(e){toast('הורדת קבצים אינה זמינה בתצוגה זו');}
}
function exportRows(rows,name){
  if(!rows.length){toast('אין נתונים לייצוא');return;}
  const aoa=[EXPORT_COLS.map(c=>c[1])].concat(rows.map(r=>EXPORT_COLS.map(c=>{
    const v=r[c[0]]; if(c[0]==='due'||c[0]==='orderDate')return v?dstr(v):'';
    if(c[0]==='daysLate')return r.late?r.daysLate:'';
    return v==null?'':v;})));
  exportAoa(aoa,name);
}
function exportAoa(aoa,name){
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=aoa[0].map((_,i)=>({wch:Math.min(42,Math.max(9,...aoa.slice(0,120).map(r=>String(r[i]==null?'':r[i]).length+2)))}));
  XLSX.utils.book_append_sheet(wb,ws,'נתונים');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(name+' '+dstr(todayISO()).replace(/\//g,'.')+'.xlsx',new Blob([buf]));
}

function recommendations(){
  const rows=filtered(),T=todayISO(),out=[];
  // 1. critical suppliers
  const sup=group(rows.filter(r=>r.late),r=>r.supplier)
    .filter(g=>g.rows.length>=2||g.lateVal>=100000)
    .map(g=>({...g,avg:Math.round(sum(g.rows,'daysLate')/g.rows.length),max:Math.max(...g.rows.map(r=>r.daysLate))}))
    .sort((a,b)=>b.lateVal-a.lateVal).slice(0,12);
  out.push({id:'sup',sev:'red',title:'ספקים לתיעדוף מיידי',
    why:'לפחות שתי שורות באיחור או מעל ₪100K תקועים. מיון לפי שווי היתרה התקועה.',
    cols:['ספק','שורות באיחור','שווי תקוע','איחור ממוצע','איחור מקסימלי','קניין מוביל'],
    rows:sup.map(g=>[esc(g.k),g.rows.length,money(g.lateVal),`<span class="tag t-amb">${g.avg} ימים</span>`,g.max+' ימים',esc(uniq(g.rows,'buyer')[0][0])]),
    data:g=>g, raw:sup.flatMap(g=>g.rows)});
  // 2. high value not approved
  const unapproved=rows.filter(isBad).sort((a,b)=>b.openILS-a.openILS).slice(0,15);
  out.push({id:'appr',sev:'amb',title:'הזמנות בסכום גבוה שטרם אושרו ע״י ספק',
    why:'שורות שהסטטוס שלהן אינו "אושר ע״י ספק", לפי שווי. כל יום בסטטוס כזה הוא יום שלא התחיל להימנות לאספקה.',
    cols:['הזמנה','ספק','סטטוס','ת. אספקה','שווי יתרה','קניין'],
    rows:unapproved.map(r=>[esc(r.po),esc(r.supplier),`<span class="tag t-amb">${esc(r.status)}</span>`,dstr(r.due)+(r.late?` <span class="tag t-red">${r.daysLate} ימי איחור</span>`:''),money(r.openILS),esc(r.buyer)]),
    raw:unapproved});
  // 3. approaching due, nothing received
  const soon=rows.filter(r=>!r.late&&r.daysLate!=null&&r.daysLate>=-21&&(r.qtyRec||0)===0&&r.openILS>=20000)
    .sort((a,b)=>b.openILS-a.openILS).slice(0,15);
  out.push({id:'soon',sev:'amb',title:'מתקרב לתאריך היעד ללא אספקה כלשהי',
    why:'אספקה בתוך 21 יום, מעל ₪20K, וטרם התקבלה אף יחידה. כאן עוד אפשר למנוע את האיחור.',
    cols:['הזמנה','ספק','תיאור','ת. אספקה','בעוד','שווי יתרה'],
    rows:soon.map(r=>[esc(r.po),esc(r.supplier),esc((r.desc||'').slice(0,46)),dstr(r.due),(-r.daysLate)+' ימים',money(r.openILS)]),
    raw:soon});
  // 4. closure candidates
  const close=rows.filter(r=>(r.openILS<=0&&(r.qtyOpen||0)>0)||((r.qtyRec||0)>0&&r.pct>=98&&r.late)||(r.late&&r.daysLate>365&&r.openILS<5000))
    .sort((a,b)=>b.daysLate-a.daysLate).slice(0,20);
  out.push({id:'close',sev:'sea',title:'מועמדות לסגירה ידנית ב־Priority',
    why:'יתרה אפסית בשווי, אספקה כמעט מלאה שנותרה פתוחה, או שאריות קטנות באיחור של למעלה משנה. סגירתן מנקה את הדוח ומשחררת התחייבות.',
    cols:['הזמנה','ספק','תיאור','ת. אספקה','ימי איחור','סופק','יתרה ₪'],
    rows:close.map(r=>[esc(r.po),esc(r.supplier),esc((r.desc||'').slice(0,42)),dstr(r.due),r.late?r.daysLate:'—',r.pct.toFixed(0)+'%',money(r.openILS)]),
    raw:close});
  // 5. stale orders
  const stale=rows.filter(r=>r.orderDate&&dayDiff(r.orderDate,T)>365).sort((a,b)=>b.openILS-a.openILS).slice(0,15);
  out.push({id:'stale',sev:'sea',title:'הזמנות שנפתחו לפני יותר משנה ועדיין פתוחות',
    why:'מחיר, מפרט וצורך אמיתי כבר ראויים לבדיקה מחדש מול הספק.',
    cols:['הזמנה','נפתחה','ספק','סטטוס','ת. אספקה','שווי יתרה'],
    rows:stale.map(r=>[esc(r.po),dstr(r.orderDate),esc(r.supplier),esc(r.status),dstr(r.due),money(r.openILS)]),
    raw:stale});
  return out;
}

function deriveSup(list){
  list.forEach(s=>{
    SUP_NUM.forEach(k=>{if(typeof s[k]==='string')s[k]=toNum(s[k]);});
    s.active=(s.status===SUP_OK);
    s.blocked=!!(s.status&&s.status!==SUP_OK&&s.status!=='טיוטא');
    s.year=s.opened?+s.opened.slice(0,4):null;
    s.local=(s.country||'')==='Israel'||!s.country;
    s.hay=((s.no||'')+' '+(s.name||'')+' '+(s.nameEn||'')+' '+(s.email||'')+' '+(s.city||'')+' '+(s.country||'')+' '+(s.cls||'')+' '+(s.type||'')+' '+(s.vat||'')+' '+(s.buyer||'')+' '+(s.phone||'')).toLowerCase();
    s.gaps=[];
    if(!s.email)s.gaps.push('דוא״ל');
    if(!s.phone)s.gaps.push('טלפון');
    if(!s.vat)s.gaps.push('עוסק מורשה');
    if(!s.cls)s.gaps.push('סיווג ענפי');
    if(s.score==null)s.gaps.push('סקור אשראי');
  });
  return list;
}

/* חשיפת הזמנות פתוחות לכל ספק — החיבור היחיד בין שני הקבצים, לפי מס' ספק */
function poBySupplier(){
  const m=new Map();
  S.rows.forEach(r=>{
    const k=(r.supplierNo||'').trim(); if(!k)return;
    let g=m.get(k); if(!g){g={lines:0,val:0,late:0,lateVal:0,bad:0,pos:new Set(),rows:[]};m.set(k,g);}
    g.lines++;g.val+=r.openILS||0;g.pos.add(r.po);g.rows.push(r);
    if(r.late){g.late++;g.lateVal+=r.openILS||0;}
    if(isBad(r))g.bad++;
  });
  return m;
}
function supFiltered(){
  const f=S.sf,q=f.q.toLowerCase().trim(),po=poBySupplier();
  return S.sup.filter(s=>{
    if(f.status.size&&!f.status.has(s.status||'—'))return false;
    if(f.type.size&&!f.type.has(s.type||'—'))return false;
    if(f.buyer.size&&!f.buyer.has(s.buyer||'—'))return false;
    if(f.country.size&&!f.country.has(s.country||'—'))return false;
    if(f.onlyOpen&&!po.has(s.no))return false;
    if(f.onlyGaps&&!s.gaps.length)return false;
    if(q&&s.hay.indexOf(q)<0)return false;
    return true;
  });
}

function bindSupBar(){
  const d=S.sd,q=$('#sfq');
  if(q){q.oninput=()=>{d.q=q.value;markDirty();};q.onkeydown=e=>{if(e.key==='Enter')applySupFilters();};}
  bindChips($('#sfStatus'),d.status);bindChips($('#sfType'),d.type);
  bindChips($('#sfBuyer'),d.buyer);bindChips($('#sfCountry'),d.country);
  const a=$('#sfOpen');if(a)a.onchange=e=>{d.onlyOpen=e.target.checked;markDirty();};
  const b=$('#sfGaps');if(b)b.onchange=e=>{d.onlyGaps=e.target.checked;markDirty();};
  const c=$('#sfClear');if(c)c.onclick=()=>{S.sd=newSupFilters();applySupFilters();};
}
function applySupFilters(){S.sf=cloneSupF(S.sd);S.dirty=false;S.limit=150;render();}

const SUP_EXPORT=['no','name','status','type','buyer','payTerm','curr','country','city','phone','email','vat','taxFile','cls','score','credit','opened','web'];
function exportSuppliers(list,name){
  const po=poBySupplier();
  const aoa=[SUP_EXPORT.map(k=>SUP_LABEL[k]).concat(['שורות פתוחות','יתרה ₪','באיחור'])];
  list.forEach(s=>{const g=po.get(s.no);
    aoa.push(SUP_EXPORT.map(k=>k==='opened'?(s[k]?dstr(s[k]):''):(s[k]==null?'':s[k]))
      .concat([g?g.lines:0,g?Math.round(g.val):0,g?g.late:0]));});
  exportAoa(aoa,name);
}

  const notActive=withPo.filter(s=>!s.active)
    .map(s=>[esc(s.name),`<span class="tag t-red">${esc(s.status)}</span>`,esc(s.buyer||''),money(po.get(s.no).val),po.get(s.no).lines]);
  blocks.push({id:'na',sev:'red',title:'ספקים שאינם פעילים ויש להם הזמנות פתוחות',
    why:'סטטוס חסום, לא פעיל או צו עיקול בכרטיס הספק, בזמן שיש אליו התחייבות פתוחה. זה חוסם תשלום ועלול לעצור אספקה.',
    cols:['ספק','סטטוס','קניין','חשיפה','שורות'],rows:notActive,raw:withPo.filter(s=>!s.active)});
  const over=withPo.filter(s=>s.credit>0&&po.get(s.no).val>s.credit)
    .sort((a,b)=>po.get(b.no).val-po.get(a.no).val);
  blocks.push({id:'cr',sev:'red',title:'חשיפה מעבר להמלצת האשראי',
    why:'היתרה הפתוחה מול הספק גבוהה מהמלצת האשראי שבכרטיס שלו. שווה לבדוק פיצול הזמנות, ערבות או תנאי תשלום.',
    cols:['ספק','חשיפה פתוחה','המלצת אשראי','יחס','סקור','תנאי תשלום'],
    rows:over.slice(0,20).map(s=>{const v=po.get(s.no).val;return[esc(s.name),money(v),money(s.credit),
      `<span class="tag ${v>s.credit*3?'t-red':'t-amb'}">${(v/s.credit*100).toFixed(0)}%</span>`,s.score==null?'—':s.score,esc(s.payTerm||'—')];}),raw:over});
  const noCredit=withPo.filter(s=>s.credit==null&&po.get(s.no).val>100000)

function readSupFile(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('לא ניתן לקרוא את הקובץ');
  fr.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
      if(!aoa.length)throw new Error('הגיליון ריק');
      let hi=0,best=-1;
      for(let i=0;i<Math.min(10,aoa.length);i++){
        const n=Object.keys(mapHeadersWith(aoa[i],SUP_ALIAS)).length; if(n>best){best=n;hi=i;}
      }
      const map=mapHeadersWith(aoa[hi],SUP_ALIAS);
      // ב-Priority יש שתי עמודות "תנאי תשלום": הראשונה קוד, השנייה תיאור
      const dup=[];aoa[hi].forEach((c,i)=>{if(norm(c)==='תנאיתשלום')dup.push(i);});
      if(dup.length>1){map.payCode=dup[0];map.payTerm=dup[dup.length-1];}
      if(map.no===undefined||map.name===undefined)throw new Error('לא נמצאו עמודות "מס.ספק" ו"שם ספק". ודאו שזהו דוח הספקים של Priority.');
      const out=[];
      for(let i=hi+1;i<aoa.length;i++){
        const a=aoa[i]; if(!a||a.every(c=>c==null||c===''))continue;
        const o={};
        for(const k in map){const v=a[map[k]];
          o[k]=k==='opened'?toDate(v):(SUP_NUM.indexOf(k)>-1?toNum(v):clean(v));}
        if(!o.no)continue;
        out.push(o);
      }
      if(!out.length)throw new Error('לא נמצאו שורות ספקים');
      S.sup=deriveSup(out);S.supLabel=file.name.replace(/\.(xlsx|xls|csv)$/i,'');S.supCustom=true;
      S.sd=newSupFilters();S.sf=newSupFilters();S.supSel=null;S.supQ='';S.limit=150;
      try{store('supdata',{rows:S.sup.map(s=>{const o={};Object.keys(SUP_ALIAS).forEach(k=>o[k]=s[k]??null);return o;}),label:S.supLabel});}
      catch(err){toast('קובץ הספקים נטען אך גדול מכדי להישמר בדפדפן');}
      toast('נטענו '+nf0.format(out.length)+' ספקים מתוך '+file.name,5000);
      render();
    }catch(err){toast('שגיאה: '+(err.message||'הקובץ לא נקרא'),6000);}
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- file reading ---------- */
function readFile(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('לא ניתן לקרוא את הקובץ');
  fr.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
      if(!aoa.length)throw new Error('הגיליון ריק');
      // find header row: the row with most alias hits in the first 10 rows
      let hi=0,best=-1;
      for(let i=0;i<Math.min(10,aoa.length);i++){
        const m=mapHeaders(aoa[i].map(x=>x));const n=Object.keys(m).length;
        if(n>best){best=n;hi=i;}
      }
      const map=mapHeaders(aoa[hi]);
      const need=['po','supplier','due','qtyOpen','status'];
      const miss=need.filter(k=>map[k]===undefined);
      if(best<6||miss.length>2)throw new Error('לא זוהו עמודות הדוח. ודאו שזהו דוח "הזמנות רכש פתוחות" של Priority.');
      const rows=[];
      for(let i=hi+1;i<aoa.length;i++){
        const a=aoa[i]; if(!a||a.every(c=>c==null||c===''))continue;
        const o={};
        for(const k in map){
          const v=a[map[k]];
          o[k]=DATEF.indexOf(k)>-1?toDate(v):(NUMF.indexOf(k)>-1?toNum(v):clean(v));
        }
        if(!o.po&&!o.supplier)continue;
        rows.push(o);
      }
      if(!rows.length)throw new Error('לא נמצאו שורות נתונים');
      S.rows=derive(rows);
      S.label=file.name.replace(/\.(xlsx|xls|csv)$/i,'');
      S.custom=true;S.limit=150;S.d=newFilters();S.f=newFilters();S.dirty=false;
      try{store('data',{rows:S.rows.map(r=>{const o={};Object.keys(ALIAS).forEach(k=>o[k]=r[k]??null);return o;}),label:S.label});}
      catch(err){toast('הדוח נטען אך גדול מכדי להישמר בדפדפן');}
      const warn=miss.length?' · עמודות שלא זוהו: '+miss.length:'';
      toast('נטענו '+nf0.format(rows.length)+' שורות מתוך '+file.name+warn,5000);
      render();
    }catch(err){toast('שגיאה: '+(err.message||'הקובץ לא נקרא'),6000);}
  };
  fr.readAsArrayBuffer(file);
}

  cat:['קטגוריה','קטגוריתמלאי','סיווג','סיווגמלאי','תאורסוגפריט','חשבון','תאורחשבון','מחלקה']
};
const SPEND_LABEL={date:'תאריך',supplierNo:'מס׳ ספק',supplier:'שם ספק',amount:'סכום בשקלים',
  amountOrig:'סכום במט״ח',curr:'מטבע',buyer:'קניין',doc:'אסמכתא / חשבונית',po:'הזמנה',
  sku:'מק״ט',desc:'תיאור',qty:'כמות',cat:'קטגוריה / חשבון'};
const SPEND_REQ=['date','supplier','amount'];
const SPEND_NUM=['amount','amountOrig','qty'];

function deriveSpend(list){
  const byNo=new Map(),byName=new Map();
  S.sup.forEach(s=>{byNo.set(s.no,s);if(s.name)byName.set(s.name.trim(),s);});
  list.forEach(r=>{
    SPEND_NUM.forEach(k=>{if(typeof r[k]==='string')r[k]=toNum(r[k]);});
    r.amount=r.amount||0;
    r.year=r.date?+r.date.slice(0,4):null;
    r.month=r.date?r.date.slice(0,7):null;
    r.q=r.date?Math.floor((+r.date.slice(5,7)-1)/3)+1:null;
    r.qk=r.year?r.year+'-Q'+r.q:null;
    const m=(r.supplierNo&&byNo.get(String(r.supplierNo).trim()))||(r.supplier&&byName.get(String(r.supplier).trim()))||null;
    r.sup=m;
    r.type=m?(m.type||'ללא סיווג'):'לא נמצא בקובץ האב';
    r.country=m?(m.country||'—'):'—';
    r.status=m?m.status:null;
    r.key=(r.supplierNo&&String(r.supplierNo).trim())||(r.supplier||'—');
    r.hay=((r.supplier||'')+' '+(r.supplierNo||'')+' '+(r.desc||'')+' '+(r.cat||'')+' '+(r.buyer||'')+' '+(r.doc||'')+' '+(r.sku||'')).toLowerCase();
  });
  return list;
}
function newSpendFilters(){return{years:new Set(),qs:new Set(),buyers:new Set(),types:new Set(),cats:new Set(),q:'',minAmt:0};}
function cloneSpendF(f){return{years:new Set(f.years),qs:new Set(f.qs),buyers:new Set(f.buyers),types:new Set(f.types),cats:new Set(f.cats),q:f.q,minAmt:f.minAmt};}
function applySpendFilters(){S.pf=cloneSpendF(S.pd);S.dirty=false;S.limit=150;render();}
function spendFiltered(){
  const f=S.pf,q=f.q.toLowerCase().trim();
  return S.spend.filter(r=>{
    if(f.years.size&&!f.years.has(String(r.year)))return false;
    if(f.qs.size&&!f.qs.has('Q'+r.q))return false;
    if(f.buyers.size&&!f.buyers.has(r.buyer||'—'))return false;
    if(f.types.size&&!f.types.has(r.type))return false;
    if(f.cats.size&&!f.cats.has(r.cat||'—'))return false;
    if(f.minAmt&&Math.abs(r.amount)<f.minAmt)return false;
    if(q&&r.hay.indexOf(q)<0)return false;
    return true;
  });
}
const spendYears=()=>[...new Set(S.spend.map(r=>r.year).filter(Boolean))].sort((a,b)=>a-b);
function spendBar(){
  const d=S.pd;
  const chip=(id,key,label,items)=>`<div class="fgrp" style="flex:1 1 200px"><span class="flab">${label}${d[key].size?' ('+d[key].size+')':''}</span>
    <div class="chips" id="${id}">${items.map(([k,n])=>`<button class="chip" data-v="${esc(k)}" aria-pressed="${d[key].has(k)}">${esc(k)}<span class="n">${n}</span></button>`).join('')}</div></div>`;
  const yrs=spendYears().map(y=>[String(y),S.spend.filter(r=>r.year===y).length]);
  return `<div class="filters">
    <div class="fgrp" style="flex:1 1 190px"><label class="flab" for="pfq">חיפוש</label>
      <input type="search" id="pfq" placeholder="ספק, קטגוריה, אסמכתא…" value="${esc(d.q)}"></div>
    ${chip('pfYear','years','שנים',yrs)}
    ${chip('pfQ','qs','רבעונים',[['Q1',0],['Q2',0],['Q3',0],['Q4',0]].map(([k])=>[k,S.spend.filter(r=>r.q===+k[1]).length]))}
    ${chip('pfType','types','סוג ספק',uniq(S.spend,'type').slice(0,14))}
    ${chip('pfBuyer','buyers','קניין',uniq(S.spend,'buyer').slice(0,14))}
    <div class="fgrp" style="flex:0 1 150px"><label class="flab" for="pfMin">סכום מינימלי (₪)</label>
      <input type="text" id="pfMin" inputmode="numeric" value="${d.minAmt||''}" placeholder="0"></div>
    <div class="fgrp" style="flex:0 1 auto;align-self:flex-end;display:flex;gap:6px">
      ${refreshBtn('','רענון תצוגה')}<button class="btn btn-sm" id="pfClear">איפוס סינון</button></div>
  </div>`;
}
function bindSpendBar(){
  const d=S.pd,q=$('#pfq');
  if(q){q.oninput=()=>{d.q=q.value;markDirty();};q.onkeydown=e=>{if(e.key==='Enter')applySpendFilters();};}
  bindChips($('#pfYear'),d.years);bindChips($('#pfQ'),d.qs);
  bindChips($('#pfType'),d.types);bindChips($('#pfBuyer'),d.buyers);
  const m=$('#pfMin');if(m){m.oninput=()=>{d.minAmt=toNum(m.value)||0;markDirty();};m.onkeydown=e=>{if(e.key==='Enter')applySpendFilters();};}
  const c=$('#pfClear');if(c)c.onclick=()=>{S.pd=newSpendFilters();applySpendFilters();};
}
const spendSum=a=>a.reduce((s,r)=>s+(r.amount||0),0);
function spendGroup(arr,fn){
  const m=new Map();
  arr.forEach(r=>{const k=fn(r);if(k==null)return;let g=m.get(k);if(!g){g={k,n:0,v:0,rows:[]};m.set(k,g);}g.n++;g.v+=r.amount||0;g.rows.push(r);});
  return [...m.values()];
}

    <div class="box box-p"><div class="gauge-k">הספק הגדול</div><div class="gauge-v" style="font-size:22px">${top.length?short(top[0].v):'—'}</div>

    <div class="box box-p"><div class="gauge-k">טווח התקופה</div><div class="gauge-v" style="font-size:22px">${byYear.length?byYear[0].k+'–'+byYear[byYear.length-1].k:'—'}</div>

      <div class="gauge-v" style="color:${rows.filter(r=>!r.sup).length?'var(--amber)':'var(--moss)'}">${nf0.format(spendGroup(rows.filter(r=>!r.sup),r=>r.key).length)}</div>
      <div class="gauge-s">${money(spendSum(rows.filter(r=>!r.sup)))} · ספקים שלא נמצאו לפי מספר או שם</div></div>
  </div>

  <div class="sec"><div class="box box-p"><div class="chart-t">ספנד לפי שנה</div>
    <div class="chart-s">סך ההוצאה בפועל בכל שנה בתצוגה</div>
    <div style="overflow-x:auto">${byYear.length?columns(byYear.map(g=>({k:String(g.k),lab:String(g.k),v:g.v,c:'var(--brand)'}))):'<div class="chart-s">אין נתונים.</div>'}</div></div></div>

  <div class="sec"><div class="box box-p"><div class="chart-t">ספנד רבעוני</div>

      c:g.k.slice(-1)==='1'?'var(--sea)':'var(--brand)'}))):''}</div></div></div>

  <div class="sec grid2">
    <div class="box box-p"><div class="chart-t">20 הספקים הגדולים</div><div class="chart-s">לפי סך הוצאה בתצוגה</div>
      ${bars(top.slice(0,20).map(g=>({k:(g.rows[0].supplier||g.k),v:g.v,lab:money(g.v)+' · '+(g.v/tot*100).toFixed(1)+'%',cls:'moss'})))}</div>

/* ---------- השוואת שנים ---------- */
function renderSpendYoY(){
  const p=$('#p-pyoy'),rows=spendFiltered(),yrs=spendYears();
  if(yrs.length<2&&S.spend.length){/* still render, with one year */}
  if(S.yA==null||yrs.indexOf(S.yA)<0)S.yA=yrs.length?yrs[yrs.length-1]:null;
  if(S.yB==null||yrs.indexOf(S.yB)<0)S.yB=yrs.length>1?yrs[yrs.length-2]:S.yA;
  const A=rows.filter(r=>r.year===S.yA),B=rows.filter(r=>r.year===S.yB);
  const ta=spendSum(A),tb=spendSum(B),dlt=ta-tb;
  const mk=arr=>{const m=new Map();spendGroup(arr,r=>r.key).forEach(g=>m.set(g.k,g));return m;};
  const ma=mk(A),mb=mk(B);
  const keys=[...new Set([...ma.keys(),...mb.keys()])];
  const comp=keys.map(k=>{const a=ma.get(k),b=mb.get(k);
    const va=a?a.v:0,vb=b?b.v:0;
    return{k,name:(a||b).rows[0].supplier||k,type:(a||b).rows[0].type,va,vb,d:va-vb,
      pct:vb?((va-vb)/Math.abs(vb)*100):(va?null:0)};});
  const grew=comp.filter(c=>c.d>0).sort((a,b)=>b.d-a.d);
  const shrank=comp.filter(c=>c.d<0).sort((a,b)=>a.d-b.d);
  const fresh=comp.filter(c=>c.vb===0&&c.va>0).sort((a,b)=>b.va-a.va);
  const gone=comp.filter(c=>c.va===0&&c.vb>0).sort((a,b)=>b.vb-a.vb);
  const qa=[1,2,3,4].map(q=>({q,a:spendSum(A.filter(r=>r.q===q)),b:spendSum(B.filter(r=>r.q===q))}));
  const byTypeC=[...new Set(rows.map(r=>r.type))].map(t=>({t,
    a:spendSum(A.filter(r=>r.type===t)),b:spendSum(B.filter(r=>r.type===t))}))
    .filter(x=>x.a||x.b).sort((a,b)=>(b.a+b.b)-(a.a+a.b));
  const pctTag=v=>v==null?'<span class="tag t-sea">חדש</span>':

      <button class="btn btn-sm" id="xYoY">ייצוא ההשוואה</button></div>
  </div></div>

  <div class="sec grid3">
    <div class="box box-p"><div class="gauge-k">${S.yA}</div><div class="gauge-v">${short(ta)}</div>
      <div class="gauge-s">${nf0.format(A.length)} תנועות · ${nf0.format(ma.size)} ספקים</div></div>
    <div class="box box-p"><div class="gauge-k">${S.yB}</div><div class="gauge-v">${short(tb)}</div>
      <div class="gauge-s">${nf0.format(B.length)} תנועות · ${nf0.format(mb.size)} ספקים</div></div>
    <div class="box box-p"><div class="gauge-k">שינוי</div>
      <div class="gauge-v" style="color:${dlt>0?'var(--red)':'var(--moss)'}">${dlt>0?'+':''}${short(dlt)}</div>

  </div>

  <div class="sec grid2">

          <td class="ta-e num">${money(c.va)}</td><td class="ta-e num">${money(c.vb)}</td>

  bindSpendBar();

const PIVOT_DIM=[['supplier','ספק'],['type','סוג ספק'],['buyer','קניין'],['cat','קטגוריה'],['country','ארץ']];
const PIVOT_PER=[['year','שנתי'],['qk','רבעוני'],['month','חודשי']];
function renderSpendPivot(){
  const p=$('#p-ppivot'),rows=spendFiltered();

  const dimFn=r=>dim==='supplier'?(r.supplier||r.key):(r[dim]||'—');
  const perFn=r=>per==='year'?(r.year?String(r.year):null):r[per];
  const periods=[...new Set(rows.map(perFn).filter(Boolean))].sort();
  const shown=per==='month'?periods.slice(-24):per==='qk'?periods.slice(-16):periods;
  const m=new Map();
  rows.forEach(r=>{const d=dimFn(r),pk=perFn(r);if(!pk)return;
    let g=m.get(d);if(!g){g={d,tot:0,cells:{}};m.set(d,g);}
    g.cells[pk]=(g.cells[pk]||0)+(r.amount||0);g.tot+=r.amount||0;});
  const list=[...m.values()].sort((a,b)=>b.tot-a.tot);
  const totals={};shown.forEach(pk=>totals[pk]=list.reduce((s,g)=>s+(g.cells[pk]||0),0));
  const grand=list.reduce((s,g)=>s+g.tot,0);
  const perLabel=pk=>per==='qk'?('רבעון '+pk.slice(-1)+'/'+pk.slice(0,4)):per==='month'?monLabel(pk):pk;
  p.innerHTML=`<div class="sec">${spendBar()}</div>

    <div class="fgrp" style="flex:0 1 180px"><label class="flab" for="pvD">חתך</label>

      ${list.slice(0,S.limit).map(g=>`<tr><td>${esc(g.d)}</td>
        ${shown.map(pk=>{const v=g.cells[pk]||0;return `<td class="ta-e num" style="${v?'':'color:var(--faint)'}">${v?short(v):'—'}</td>`;}).join('')}
        <td class="ta-e num" style="font-weight:500">${short(g.tot)}</td></tr>`).join('')}
      </tbody><tfoot><tr style="background:var(--sunk)"><td style="font-weight:500">סה״כ</td>
        ${shown.map(pk=>`<td class="ta-e num" style="font-weight:500">${short(totals[pk])}</td>`).join('')}
        <td class="ta-e num" style="font-weight:500">${short(grand)}</td></tr></tfoot></table></div>
      ${list.length>S.limit?`<div class="more"><button class="btn" id="pvmore">הצגת 150 נוספים</button></div>`:''}`

    'דוח ספנד '+PIVOT_PER.find(x=>x[0]===per)[1]);

    why:'הופיעו בדוח הספנד אך לא נמצאו בקובץ הספקים לפי מספר או שם. או שקובץ האב לא עדכני, או שההוצאה עקפה את תהליך הרכש.',
    cols:['ספק','מזהה','ספנד','תנועות','קניין'],

}

function buildSpend(aoa,hi,map,name){
  const out=[];
  for(let i=hi+1;i<aoa.length;i++){
    const a=aoa[i]; if(!a||a.every(c=>c==null||c===''))continue;
    const o={};
    for(const k in map){const v=a[map[k]];
      o[k]=k==='date'?toDate(v):(SPEND_NUM.indexOf(k)>-1?toNum(v):clean(v));}
    if(!o.date&&!o.supplier)continue;
    if(o.amount==null)o.amount=0;
    out.push(o);
  }
  if(!out.length){toast('לא נמצאו שורות נתונים');return;}
  S.spend=deriveSpend(out);S.spendLabel=name;S.pPending=null;
  S.pd=newSpendFilters();S.pf=newSpendFilters();S.yA=null;S.yB=null;S.limit=150;S.tab='pover';
  try{store('spenddata',{rows:S.spend.map(r=>{const o={};Object.keys(SPEND_ALIAS).forEach(k=>o[k]=r[k]??null);return o;}),label:name});}
  catch(e){toast('הדוח נטען אך גדול מכדי להישמר בדפדפן');}
  toast('נטענו '+nf0.format(out.length)+' תנועות · '+money(spendSum(S.spend)),5000);
  render();
}
function readSpendFile(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('לא ניתן לקרוא את הקובץ');
  fr.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
      if(!aoa.length)throw new Error('הגיליון ריק');
      let hi=0,best=-1;
      for(let i=0;i<Math.min(12,aoa.length);i++){
        const n=Object.keys(mapHeadersWith(aoa[i],SPEND_ALIAS)).length;if(n>best){best=n;hi=i;}
      }
      const map=mapHeadersWith(aoa[hi],SPEND_ALIAS);
      const name=file.name.replace(/\.(xlsx|xls|csv)$/i,'');
      const miss=SPEND_REQ.filter(k=>map[k]===undefined);
      if(miss.length){
        S.pPending={headers:aoa[hi],aoa,hi,map,name,sample:aoa.slice(hi+1,hi+6)};
        S.mode='spend';S.tab='pload';render();
        toast('לא זוהו: '+miss.map(k=>SPEND_LABEL[k]).join(', ')+'. מפו ידנית למטה.',6500);
        return;
      }
      buildSpend(aoa,hi,map,name);
    }catch(err){toast('שגיאה: '+(err.message||'הקובץ לא נקרא'),6000);}
  };
  fr.readAsArrayBuffer(file);
}

  opened:'תאריך פתיחה',lastIn:'כניסה אחרונה',lastOut:'יציאה אחרונה',lastMove:'תנועה אחרונה במפעל',descEn:'תיאור לועזי'};
const ITEM_KEYS=Object.keys(ITEM_ALIAS);
const ITEM_DATE=['lastPriceDate','opened','lastIn','lastOut','lastMove'];

/* שערי המרה משוערים לחישוב מחיר בשקלים — ניתנים לעריכה בלשונית הטעינה */
const FX_DEFAULT={ILS:1,USD:3.7,EUR:4,GBP:4.7,CHF:4.1};
function itemFx(){return Object.assign({},FX_DEFAULT,store('ifx')||{});}
const skuKey=v=>v==null?'':String(v).trim().toUpperCase();
const yearsAgo=(iso,y)=>{if(!iso)return true;const d=new Date();d.setFullYear(d.getFullYear()-y);return iso<d.toISOString().slice(0,10);};

function deriveItems(list){
  const fx=itemFx();
  const spendBy=new Map(),openBy=new Map();
  S.spend.forEach(r=>{const k=skuKey(r.sku);if(!k)return;let g=spendBy.get(k);
    if(!g){g={v:0,qty:0,n:0,sups:new Map(),years:new Map(),last:null};spendBy.set(k,g);}
    g.v+=r.amount||0;g.qty+=r.qty||0;g.n++;
    const sk=r.supplier||r.supplierNo||'—';g.sups.set(sk,(g.sups.get(sk)||0)+(r.amount||0));
    if(r.year)g.years.set(r.year,(g.years.get(r.year)||0)+(r.amount||0));
    if(r.date&&(!g.last||r.date>g.last))g.last=r.date;});
  S.rows.forEach(r=>{const k=skuKey(r.sku);if(!k)return;let g=openBy.get(k);
    if(!g){g={v:0,n:0,rows:[]};openBy.set(k,g);}g.v+=r.openILS||0;g.n++;g.rows.push(r);});
  list.forEach(r=>{
    ITEM_NUM.forEach(k=>{if(typeof r[k]==='string')r[k]=toNum(r[k]);});
    r.k=skuKey(r.sku);
    r.itype=r.itype||'ללא סיווג';r.cat=r.cat||'—';r.wh=r.wh||'—';r.group=r.group||'—';r.status=r.status||'—';
    r.supKey=r.supNo?String(r.supNo).trim():'';
    r.priceILS=r.lastPrice?(r.curr&&r.curr!=='ILS'?(fx[r.curr]?r.lastPrice*fx[r.curr]:null):r.lastPrice):null;
    r.move=[r.lastMove,r.lastIn,r.lastOut].filter(Boolean).sort().pop()||null;
    r.dormant=yearsAgo(r.move,3);
    r.stalePrice=!!(r.lastPrice&&yearsAgo(r.lastPriceDate,2));
    const sp=spendBy.get(r.k),op=openBy.get(r.k);
    r.spend=sp?sp.v:0;r.spendQty=sp?sp.qty:0;r.spendN=sp?sp.n:0;r.spendSups=sp?sp.sups:null;r.spendYears=sp?sp.years:null;r.spendLast=sp?sp.last:null;
    r.openPO=op?op.v:0;r.openRows=op?op.rows:[];
    r.hay=((r.sku||'')+' '+(r.desc||'')+' '+(r.descEn||'')+' '+(r.supName||'')+' '+(r.supNo||'')+' '+r.itype+' '+r.cat+' '+r.wh+' '+r.group+' '+(r.family||'')).toLowerCase();
  });
  return list;
}

/* ---------- שמירה דחוסה: הקובץ גדול מדי לשמירה רגילה ---------- */
async function packItems(rows){
  const json=JSON.stringify({keys:ITEM_KEYS,rows:rows.map(r=>ITEM_KEYS.map(k=>r[k]??null))});
  const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return btoa(s);
}
async function unpackItems(z){
  const bin=atob(z),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  const d=JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  return d.rows.map(a=>{const o={};d.keys.forEach((k,i)=>o[k]=a[i]);return o;});
}

  sups:new Set(f.sups),q:f.q,onlyPrice:f.onlyPrice,onlyNoSup:f.onlyNoSup,onlyDormant:f.onlyDormant,onlySpend:f.onlySpend};}

    if(f.cats.size&&!f.cats.has(r.cat))return false;
    if(f.whs.size&&!f.whs.has(r.wh))return false;
    if(f.statuses.size&&!f.statuses.has(r.status))return false;
    if(f.groups.size&&!f.groups.has(r.group))return false;

      ${bars(pref.slice(0,20).map(g=>({k:g.name,v:sp?g.spend:g.n,lab:sp?money(g.spend)+' · '+nf0.format(g.n)+' פריטים':nf0.format(g.n)+' פריטים · '+(g.n/totN*100).toFixed(1)+'%'})))}</div>
    ${actual||`<div class="box box-p"><div class="chart-t">פריטים עם מחיר לפי ספק</div><div class="chart-s">כמה מהפריטים של כל ספק נקנו בפועל (יש להם מחיר קנייה אחרון)</div>

  </div>

/* ---------- קטלוג וכרטיס פריט ---------- */

  {k:'sku',t:'מק״ט ותיאור',cls:'desc',f:r=>`${esc(r.desc||'')}<span class="sub">${esc(r.sku)}${r.unit?' · '+esc(r.unit):''}</span>`},

  {k:'wh',t:'קבוצת מחסן',f:r=>`${esc(r.wh)}<span class="sub">${esc(r.group)}</span>`},
  {k:'supName',t:'ספק מועדף',f:r=>r.supName?`${esc(r.supName)}<span class="sub">${esc(r.supNo)}</span>`:'<span class="tag t-amb">ללא ספק</span>'},
  {k:'priceILS',t:'מחיר אחרון',cls:'ta-e',f:itemPrice},
  {k:'spend',t:'הוצאה בפועל',cls:'ta-e',sp:1,f:r=>r.spend?`<span class="num">${money(r.spend)}</span><span class="sub">${nf0.format(r.spendN)} תנועות</span>`:'<span style="color:var(--faint)">—</span>'},
  {k:'move',t:'תנועה אחרונה',f:r=>r.move?dstr(r.move)+(r.dormant?'<span class="sub" style="color:var(--amber)">רדום</span>':''):'<span class="sub" style="color:var(--amber)">אין תנועה</span>'},
  {k:'status',t:'סטטוס',f:r=>itemStatusTag(r.status)}
];
function bindItemRows(p){
  p.querySelectorAll('[data-sku]').forEach(tr=>tr.onclick=()=>{S.itemSel=tr.dataset.sku;S.tab='icat';render();window.scrollTo({top:0,behavior:'smooth'});});
}
function itemCard(r){
  const fld=k=>{const v=r[k];if(v==null||v==='')return '<span style="color:var(--faint)">—</span>';
    return ITEM_DATE.indexOf(k)>-1?dstr(v):ITEM_NUM.indexOf(k)>-1?nf2.format(v):esc(v);};
  const yrs=r.spendYears?[...r.spendYears.entries()].sort((a,b)=>a[0]-b[0]):[];
  const ss=r.spendSups?[...r.spendSups.entries()].sort((a,b)=>b[1]-a[1]):[];
  const alt=r.supKey?S.items.filter(x=>x!==r&&x.supKey===r.supKey).length:0;
  return `<div class="sec"><div class="box box-p">
    <div class="sec-h" style="margin-bottom:4px"><h2>${esc(r.desc||r.sku)}</h2><p>${esc(r.sku)} · ${itemStatusTag(r.status)}${r.dormant?' <span class="tag t-amb">רדום</span>':''}${r.stalePrice?' <span class="tag t-amb">מחיר ישן</span>':''}</p>
      <button class="btn btn-sm" id="itClose">סגירה</button></div>
    <div class="kvgrid">${ITEM_KEYS.map(k=>`<div class="kv"><span class="kvk">${ITEM_LABEL[k]}</span><span class="kvv">${fld(k)}</span></div>`).join('')}
      <div class="kv"><span class="kvk">מחיר משוער ₪</span><span class="kvv">${r.priceILS?money(r.priceILS):'—'}</span></div>
      <div class="kv"><span class="kvk">פריטים נוספים אצל הספק</span><span class="kvv">${nf0.format(alt)}</span></div></div>
    ${r.spend?`<div class="grid2" style="margin-top:14px">
      <div><div class="chart-t">הוצאה לפי שנה</div><div class="chart-s">${money(r.spend)} · ${nf0.format(r.spendN)} תנועות${r.spendLast?' · אחרונה '+dstr(r.spendLast):''}</div>
        ${columns(yrs.map(([y,v])=>({k:String(y),lab:String(y),v,c:'var(--brand)'})))}</div>
      <div><div class="chart-t">ספקים בפועל</div><div class="chart-s">מי קיבל את הכסף על המק״ט הזה</div>
        ${bars(ss.slice(0,8).map(([k,v])=>({k,v,lab:money(v),cls:r.supName&&String(k).trim()===r.supName.trim()?'moss':'amb'})))}</div></div>`:''}
    ${r.openRows.length?`<div class="chart-t" style="margin-top:14px">הזמנות פתוחות (${r.openRows.length})</div>
      <div class="tscroll" style="margin-top:6px"><table style="min-width:600px"><thead><tr><th style="cursor:default">הזמנה</th><th style="cursor:default">ספק</th>
        <th style="cursor:default">ת. אספקה</th><th style="cursor:default" class="ta-e">יתרה</th><th style="cursor:default" class="ta-e">שווי</th></tr></thead><tbody>
        ${r.openRows.map(o=>`<tr class="${o.late?'late':''}"><td>${esc(o.po)}</td><td>${esc(o.supplier||'')}</td><td>${dstr(o.due)}</td>
          <td class="ta-e num">${qty(o.qtyOpen)}</td><td class="ta-e num">${money(o.openILS)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </div></div>`;
}
function renderItemCatalog(){
  const p=$('#p-icat'),rows=itemFiltered(),sp=hasItemSpend();
  const cols=ICOLS.filter(c=>!c.sp||sp);
  if(!S.isort)S.isort={k:sp?'spend':'sku',dir:sp?-1:1};
  const {k,dir}=S.isort;
  const sorted=rows.slice().sort((a,b)=>{let x=a[k],y=b[k];
    if(typeof x==='number'||typeof y==='number'||k==='priceILS'||k==='spend')return ((x||0)-(y||0))*dir;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'he')*dir;});
  const sel=S.itemSel&&S.items.find(r=>r.k===S.itemSel);
  p.innerHTML=`<div class="sec">${itemBar()}</div>${sel?itemCard(sel):''}
  <div class="sec"><div class="sec-h"><h2>קטלוג פריטים (${nf0.format(rows.length)})</h2><p>לחיצה על כותרת ממיינת · לחיצה על שורה פותחת כרטיס פריט</p>
    <button class="btn btn-sm" id="xIcat">ייצוא לאקסל</button></div>
    ${rows.length?`<div class="tscroll"><table><thead><tr>${cols.map(c=>`<th data-isk="${c.k}">${c.t} ${k===c.k?`<span class="ar">${dir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
      <tbody>${sorted.slice(0,S.limit).map(r=>`<tr class="clickrow" data-sku="${esc(r.k)}">${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${sorted.length>S.limit?`<div class="more"><button class="btn" id="icMore">הצגת 150 שורות נוספות (${nf0.format(sorted.length-S.limit)} נותרו)</button></div>`:''}`
    :`<div class="box empty"><b>אין פריטים התואמים את הסינון</b>נקו את המסננים או שנו את החיפוש.</div>`}</div>`;

function itemRecs(rows){
  const recs=[];
  const add=(title,why,sev,list,extra)=>{if(list.length)recs.push({title,why,sev,rows:list,extra});};
  add('פריטים פעילים ללא ספק מועדף','בלי ספק מועדף אין מחיר בסיס, וכל רכישה מתחילה מאפס. כדאי להגדיר ספק לפריטים שזזים.','sev-red',
    rows.filter(r=>r.status==='פעיל'&&!r.supKey).sort((a,b)=>(b.spend-a.spend)||((b.move||'')<(a.move||'')?-1:1)));
  if(hasItemSpend()){
    add('נקנו מספק שאינו הספק המועדף','ההוצאה בפועל הלכה לספק אחר מזה שבכרטיס הפריט. לעדכן את הכרטיס או לבדוק למה לא נקנה מהמועדף.','sev-amb',
      rows.filter(r=>r.spend&&r.supName&&r.spendSups&&![...r.spendSups.keys()].some(k=>String(k).trim()===r.supName.trim())).sort((a,b)=>b.spend-a.spend));
    add('מק״טים עם הוצאה גבוהה ומספר ספקים','פריט שנקנה מכמה ספקים הוא מועמד למכרז או להסכם מסגרת עם ספק אחד.','sev-sea',
      rows.filter(r=>r.spendSups&&r.spendSups.size>1).sort((a,b)=>b.spend-a.spend));
  }
  add('סטטוס "אסור לקנייה" עם הזמנה פתוחה','פריט חסום לקנייה מופיע בהזמנה פתוחה — לבדוק את ההזמנה או את הסטטוס.','sev-red',
    rows.filter(r=>r.status==='אסור לקניה'&&r.openPO).sort((a,b)=>b.openPO-a.openPO));
  add('מחיר קנייה אחרון ישן (מעל שנתיים)','מחיר ישן לא משקף את השוק. לפני ההזמנה הבאה כדאי לבקש הצעת מחיר מעודכנת.','sev-amb',
    rows.filter(r=>r.stalePrice&&!r.dormant).sort((a,b)=>(b.priceILS||0)-(a.priceILS||0)));
  add('פריטים רדומים שעדיין לא הוגדרו כלא פעילים','ללא תנועה במפעל 3 שנים ומעלה. מועמדים לסגירה או לבדיקת מלאי מת.','sev-sea',
    rows.filter(r=>r.dormant&&r.status!=='לא פעיל'&&!r.openPO).sort((a,b)=>(b.priceILS||0)-(a.priceILS||0)));
  const byDesc=new Map();rows.forEach(r=>{const d=norm(r.desc);if(d.length<6)return;let a=byDesc.get(d);if(!a){a=[];byDesc.set(d,a);}a.push(r);});
  add('תיאורים כפולים — חשד למק״ט כפול','אותו תיאור בדיוק תחת כמה מק״טים. איחוד מק״טים מונע מלאי כפול ומאפשר לרכז קנייה.','sev-sea',
    [...byDesc.values()].filter(a=>a.length>1).sort((a,b)=>b.length-a.length).flat());
  return recs;
}

function readItemFile(file){
  toast('קורא את קובץ הפריטים…');
  const fr=new FileReader();
  fr.onerror=()=>toast('לא ניתן לקרוא את הקובץ');
  fr.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
      if(!aoa.length)throw new Error('הגיליון ריק');
      let hi=0,best=-1;
      for(let i=0;i<Math.min(10,aoa.length);i++){const n=Object.keys(mapHeadersWith(aoa[i],ITEM_ALIAS)).length;if(n>best){best=n;hi=i;}}
      /* התאמה מדויקת בלבד — בקובץ יש עשרות עמודות עם שמות דומים */
      const hn=aoa[hi].map(h=>norm(h)),map={};
      ITEM_KEYS.forEach(k=>{for(const a of ITEM_ALIAS[k]){const i=hn.indexOf(norm(a));if(i>-1){map[k]=i;break;}}});
      if(map.sku===undefined||map.desc===undefined)throw new Error('לא נמצאו עמודות מק״ט ותיאור. ודאו שזהו קובץ כרטיס פריט.');
      const out=[];
      for(let i=hi+1;i<aoa.length;i++){
        const a=aoa[i];if(!a)continue;const o={};
        for(const k in map){const v=a[map[k]];o[k]=ITEM_DATE.indexOf(k)>-1?toDate(v):ITEM_NUM.indexOf(k)>-1?(toNum(v)||null):clean(v);}
        if(!o.sku)continue;out.push(o);
      }
      if(!out.length)throw new Error('לא נמצאו פריטים');
      S.items=deriveItems(out);S.itemLabel=file.name.replace(/\.(xlsx|xls|csv)$/i,'');S.itemSel=null;
      S.itd=newItemFilters();S.itf=newItemFilters();S.limit=150;S.mode='item';S.tab='iover';
      toast('נטענו '+nf0.format(out.length)+' פריטים · '+(ITEM_KEYS.length-Object.keys(map).length?'עמודות שלא זוהו: '+(ITEM_KEYS.length-Object.keys(map).length):'כל העמודות זוהו'),5000);
      render();
      saveItems().then(()=>{if(S.tab==='iload')render();});
    }catch(err){toast('שגיאה: '+(err.message||'הקובץ לא נקרא'),6000);}
  };
  fr.readAsArrayBuffer(file);
}

const savedSpend=store('spenddata');
if(savedSpend&&savedSpend.rows&&savedSpend.rows.length){S.spend=deriveSpend(savedSpend.rows);S.spendLabel=savedSpend.label;}
const savedSup=store('supdata');
if(savedSup&&savedSup.rows&&savedSup.rows.length){S.sup=deriveSup(savedSup.rows);S.supLabel=savedSup.label;S.supCustom=true;}

$('#modes').onclick=e=>{const b=e.target.closest('.mode');if(!b)return;
  S.mode=b.dataset.m;S.tab=modeTabs()[0].id;S.limit=150;render();window.scrollTo({top:0,behavior:'smooth'});};
$('#btnLoad').onclick=()=>$(S.mode==='sup'?'#sfile':S.mode==='spend'?'#pfile':S.mode==='item'?'#ifile':'#file').click();
$('#ifile').onchange=e=>{if(e.target.files[0])readItemFile(e.target.files[0]);e.target.value='';};
$('#file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);e.target.value='';};
$('#sfile').onchange=e=>{if(e.target.files[0])readSupFile(e.target.files[0]);e.target.value='';};
$('#pfile').onchange=e=>{if(e.target.files[0])readSpendFile(e.target.files[0]);e.target.value='';};
$('#btnReset').onclick=()=>{
  S.rows=derive(fromSeed());S.label=seed.source+' · '+dstr(seed.snapshot);S.custom=false;
  S.d=newFilters();S.f=newFilters();S.dirty=false;S.limit=150;
  try{localStorage.removeItem('galam.data');}catch(e){}
  window.__galamSync&&window.__galamSync('data',null);
  toast('הנתונים נוקו');render();
};
const theme=store('theme'); if(theme)document.documentElement.dataset.theme=theme;
$('#btnTheme').onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store('theme',nx);
};
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.dataTransfer&&[...e.dataTransfer.types].indexOf('Files')>-1){e.preventDefault();
    if(ev==='drop'&&e.dataTransfer.files[0])(S.mode==='sup'?readSupFile:S.mode==='spend'?readSpendFile:S.mode==='item'?readItemFile:readFile)(e.dataTransfer.files[0]);}
}));

render();
};
</script>
<script>
/* ---------- סנכרון עם מסד הנתונים (Vercel + Postgres) ----------
   בעלייה: טוען את כל הנתונים מ-/api/store לזיכרון הדפדפן ואז מפעיל את המערכת.
   כל שמירה נשלחת גם לשרת. בלי שרת (קובץ מקומי) — עובד מהדפדפן בלבד. */
(function(){
"use strict";
const API='/api/store', SYNC=['data','supdata','spenddata','supmeta','crit','ok','itemdata'];
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},
          set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},
          del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
let pass=ls.get('galam.__pass')||'', online=false, started=false;
const timers={};
function note(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),4200);}
function send(k,v){
  return fetch(API+'?key='+encodeURIComponent(k),{method:v==null?'DELETE':'PUT',
    headers:{'Content-Type':'application/json','x-app-key':pass},body:v==null?undefined:JSON.stringify(v)})
    .then(r=>{if(!r.ok)throw new Error(r.status===413?'הקובץ גדול מדי לשמירה בשרת':'שגיאת שרת '+r.status);})
    .catch(e=>note('השמירה למסד הנתונים נכשלה: '+e.message));
}
window.__galamSync=(k,v)=>{
  if(!online||SYNC.indexOf(k)<0)return;
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>send(k,v),600);
};
function start(){if(started)return;started=true;window.__galamApp();}
function login(msg){
  const w=document.createElement('div');
  w.style.cssText='position:fixed;inset:0;background:var(--paper);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px';
  w.innerHTML='<form class="box box-p" style="width:min(360px,100%);display:flex;flex-direction:column;gap:10px">'+
    '<h2 style="font-size:18px">מערכת לניהול רכש גלעם</h2>'+
    '<label class="flab" for="gpw">סיסמת כניסה</label>'+
    '<input type="text" id="gpw" autocomplete="current-password" style="-webkit-text-security:disc" required>'+
    '<div class="note" id="gmsg" style="color:var(--red);margin:0"></div>'+
    '<button class="btn btn-solid" type="submit">כניסה</button></form>';
  document.body.appendChild(w);
  w.querySelector('#gmsg').textContent=msg||'';
  const i=w.querySelector('#gpw');i.focus();
  w.querySelector('form').onsubmit=e=>{e.preventDefault();pass=i.value;ls.set('galam.__pass',pass);w.remove();boot();};
}
function boot(){
  fetch(API,{headers:{'x-app-key':pass}}).then(r=>{
    if(r.status===401){login(pass?'סיסמה שגויה':'');return null;}
    if(!r.ok)throw new Error('status '+r.status);
    return r.json();
  }).then(remote=>{
    if(!remote)return;
    online=true;
    const first=!Object.keys(remote).length;  /* מסד ריק — מעלים את מה שכבר שמור בדפדפן */
    SYNC.forEach(k=>{
      if(remote[k])ls.set('galam.'+k,JSON.stringify(remote[k].value));
      else if(first){const loc=ls.get('galam.'+k);if(loc)send(k,JSON.parse(loc));}
      else ls.del('galam.'+k);
    });
    start();
  }).catch(()=>{start();note('אין חיבור למסד הנתונים — הנתונים נשמרים בדפדפן בלבד');});
}
if(location.protocol==='file:')start();else boot();
})();
</script>
</body>
